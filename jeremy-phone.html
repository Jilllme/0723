function photosApp(){return page('照片','<div class="scroll"><h2 class="bigtitle">图库</h2><div class="sectionhead"><b>最近项目</b><button class="link" data-action="addphotos">＋ 添加</button></div><div class="photosgrid">'+gallery().map((x,i)=>'<button class="photocell" data-action="showphoto" data-id="'+i+'"><img src="'+x.src+'" loading="lazy" alt="'+esc(x.name)+'"></button>').join('')+'</div><p class="note">示例图片并非张极本人的照片。你可以加入自己的照片，保存在当前浏览器。</p></div>')}
function photoView(){let items=gallery(),p=items[st.photo]||items[0];return '<div class="page darkpage">'+toolbar('照片','photos')+'<div class="photoarea"><img src="'+p.src+'" alt="'+esc(p.name)+'"></div><div class="photofoot"><b>'+esc(p.name)+'</b><br><small>'+(p.mine?'本地照片':'示例图片')+' · '+(st.photo+1)+' / '+items.length+'</small><div class="arrows"><button class="link" data-action="prevphoto">‹ 上一张</button><button class="link" data-action="nextphoto">下一张 ›</button></div></div></div>'}
function camera(){return '<div class="page darkpage camera">'+toolbar('相机')+'<div class="preview"><video id="video" autoplay playsinline muted style="'+(st.camera?'':'display:none')+'"></video>'+(st.camera?'':'<div class="camerahint">打开摄像头后可以真正拍照。<button data-action="startcamera">启用摄像头</button><small>需要浏览器相机权限，照片仅保存本地。</small></div>')+'</div><div class="cameracontrols"><span>照片</span><div class="cameraactions"><button data-action="openphotos">▧</button><button class="shutter" data-action="snap" aria-label="拍照"></button><button data-action="flip">↺</button></div></div></div>'}
function music(){let song=songs[st.track];return page('音乐','<div class="scroll"><div class="music-cover">JEREMY<br>PLAYLIST.</div><div class="music-head"><b>'+esc(song[0])+'</b><p>'+esc(song[1])+'</p><div class="progress"><i id="progress"></i></div><div class="controls"><button data-action="prevsong">⏮</button><button data-action="play">'+(st.playing?'Ⅱ':'▶')+'</button><button data-action="nextsong">⏭</button></div><button class="link" data-action="addaudio">＋ 选择本地音频播放</button><p style="font-size:11px;color:#a1a1aa;line-height:1.7">选择歌曲后可导入本地音频，音频只在当前页面播放。</p></div><div class="songlist"><h3>歌曲</h3>'+songs.map((x,i)=>'<button class="songrow" data-action="song" data-id="'+i+'"><span>♫</span><span style="flex:1"><b>'+esc(x[0])+'</b><small>'+esc(x[1])+'</small></span>›</button>').join('')+'</div></div>','home','darkpage')}
function ig(){let body=st.ig==='feed'?'<div class="stories">'+['JEREMY','周末','朋友','旅行'].map(x=>'<div class="story"><span class="avatar">'+x[0]+'</span>'+x+'</div>').join('')+'</div>'+[4,2,8].map((n,i)=>'<div><div class="listrow">'+avatar('zhang')+'<div class="listmain"><b>jeremy.daily</b><small>虚构账号</small></div>•••</div><img class="feedimage" src="'+photos[n]+'"><div class="feedinfo"><button data-action="like" data-id="ig'+i+'">'+(st.liked['ig'+i]?'♥':'♡')+'</button><button data-action="readonly">♧</button><button data-action="readonly">↗</button><p><b>jeremy.daily</b> '+['周末随拍。','好天气。','路上的一杯咖啡。'][i]+'</p></div></div>').join(''):'<div class="listrow">'+avatar('zhang')+'<div class="listmain"><b>jeremy.daily</b><small>虚构账号 · 生活记录</small></div></div><div class="photosgrid">'+photos.map((src,i)=>'<button class="photocell" data-action="igphoto" data-id="'+i+'"><img src="'+src+'"></button>').join('')+'</div>';return '<div class="page">'+toolbar('Instagram')+'<div class="scroll">'+body+'</div><nav class="igbar"><button data-action="igtab" data-id="feed">⌂</button><button data-action="readonly">⌕</button><button data-action="readonly">⊕</button><button data-action="igtab" data-id="profile">◉</button></nav></div>'}
function xhs(){let titles=['晚上的城市很好看','周末在路上','和朋友一起出门','天气好的时候','随手拍的街角','不赶时间的傍晚','骑行路上','生活记录'];return page('小红书','<div class="scroll"><div style="text-align:center;padding:9px 0 17px">关注　 <b style="border-bottom:2px solid #ff2442;padding-bottom:8px">发现</b>　 附近</div><div class="xhsgrid">'+photos.slice(0,8).map((src,i)=>'<button class="xhscard" data-action="xhsnote" data-id="'+i+'"><img src="'+src+'"><b>'+titles[i]+'</b><small>JEREMY ♡ '+(21+i*11)+'</small></button>').join('')+'</div><p class="note">内容为虚构笔记，不对应真实账号。</p></div>')}
function xhsNote(){let n=st.xhs;return page('笔记','<div class="scroll"><img src="'+photos[n]+'" style="width:100%;max-height:380px;object-fit:cover"><div style="padding:18px"><h3>记一些普通的日子</h3><p style="line-height:1.8;font-size:14px">忙完之后出门走走，刚好拍下这张照片。</p><small style="color:#999">JEREMY · 虚构笔记</small><div><button class="link" data-action="like" data-id="xhs'+n+'">'+(st.liked['xhs'+n]?'♥ 已收藏':'♡ 收藏')+'</button></div></div></div>','xhs')}
function notes(){return page('备忘录','<div class="scroll"><h2 class="bigtitle">备忘录</h2>'+[['周末','滑板、咖啡、相机。'],['旅行','海边公路、露营、攀冰。'],['备忘','耳机 / 钥匙 / 钱包']].map(x=>'<div class="listrow"><span class="listmain"><b>'+x[0]+'</b><small>'+x[1]+'</small></span></div>').join('')+'</div>')}
function settings(){return page('设置','<div class="scroll"><h2 class="bigtitle">设置</h2><div class="settings-card"><div class="settings-item"><b>JEREMY 的 iPhone</b><span>普通人 AU</span></div><button class="settings-item" data-action="wallpaper">更换人物摄影壁纸<span>选择照片 ›</span></button><button class="settings-item" data-action="addphotos">添加相册图片<span>＋</span></button><button class="settings-item" data-action="resetwall">恢复默认壁纸<span>↺</span></button></div><div class="settings-card"><div class="settings-item">视觉风格<span>iOS 风格 · Glass</span></div><div class="settings-item">应用数量<span>16</span></div></div><p class="note">这是虚构的张极普通人 AU 手机模拟器，不是真实手机或私人资料。可以在设置中上传你之前选中的人物壁纸。用户上传图片与音频不提交到服务器，示例图库图片来自公开图片服务。</p></div>')}
function placeholder(){return page(st.page,'<div class="placeholder">这个系统 App 保留了桌面图标，目前不开放探索。</div>')}
function go(page,sub=''){if(st.page==='camera'&&page!=='camera')stopcam();st.page=page;st.sub=sub;render()}
function render(){const homeStyle=['home','lock'].includes(st.page);screen.className='screen'+(homeStyle?' wall':'');screen.style.backgroundImage=homeStyle&&st.wall?'linear-gradient(180deg,#0002,#0002 40%,#0008),url("'+st.wall+'")':'';status.className='status'+(homeStyle||['photo','camera','calling'].includes(st.page)?'':' dark');home.className='home-line'+(homeStyle||['photo','camera','calling'].includes(st.page)?'':' dark');const pages={home:desktop,lock,wxchat:()=>chat(st.sub,true),smschat:()=>chat(st.sub,false),wechat,moments,messages,phone,calling,photos:photosApp,photo:photoView,camera,music,instagram:ig,xhs,xhsnote:xhsNote,notes,settings};root.innerHTML=pages[st.page]?pages[st.page]():placeholder();root.querySelectorAll('img').forEach(img=>{img.onerror=()=>{img.style.opacity='0';img.parentElement.style.background='linear-gradient(145deg,#bdcbd0,#607f85)'}});if(st.camera&&st.page==='camera'&&stream){const vid=document.getElementById('video');if(vid){vid.srcObject=stream;vid.play().catch(()=>{})}}clock()}
function clock(){document.getElementById('time').textContent=new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',hour12:false})}
function stopcam(){if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;st.camera=false}
async function startcam(){if(!navigator.mediaDevices?.getUserMedia){alert('需要在 HTTPS 网页中使用摄像头。');return}try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:st.facing},audio:false});st.camera=true;render()}catch(e){alert('无法开启摄像头，请检查浏览器权限。')}}
function compress(file,cb){const fr=new FileReader();fr.onload=()=>{let image=new Image();image.onload=()=>{let canvas=document.createElement('canvas'),r=Math.min(1,750/Math.max(image.width,image.height));canvas.width=Math.max(1,Math.round(image.width*r));canvas.height=Math.max(1,Math.round(image.height*r));canvas.getContext('2d').drawImage(image,0,0,canvas.width,canvas.height);cb(canvas.toDataURL('image/jpeg',.7))};image.src=fr.result};fr.readAsDataURL(file)}
root.addEventListener('click',async e=>{let b=e.target.closest('[data-app],[data-back],[data-action]');if(!b)return;if(b.dataset.app){if(['facetime','calendar','weather','clock','files','safari'].includes(b.dataset.app)){toast('这个系统应用仅作桌面展示');return}go(b.dataset.app);return}if(b.dataset.back){go(b.dataset.back);return}let a=b.dataset.action,id=b.dataset.id;switch(a){case'unlock':go('home');break;case'wxtab':st.wx=id;render();break;case'wxchat':go('wxchat',id);break;case'smschat':go('smschat',id);break;case'moments':go('moments');break;case'phonetab':st.phtab=id;render();break;case'digit':st.dial=(st.dial+id).slice(0,16);render();break;case'backspace':st.dial=st.dial.slice(0,-1);render();break;case'dial':if(st.dial){st.calling=st.dial;go('calling')}break;case'makecall':st.calling={zhang:'JEREMY',left:'左航',camp:'露营搭子',mum:'妈妈'}[id]||id;go('calling');break;case'hang':go('phone');break;case'addphotos':document.getElementById('photofile').click();break;case'wallpaper':document.getElementById('wallfile').click();break;case'resetwall':st.wall='';save();render();break;case'showphoto':st.photo=+id;go('photo');break;case'prevphoto':st.photo=(st.photo+gallery().length-1)%gallery().length;render();break;case'nextphoto':st.photo=(st.photo+1)%gallery().length;render();break;case'openphotos':go('photos');break;case'startcamera':await startcam();break;case'flip':st.facing=st.facing==='user'?'environment':'user';stopcam();await startcam();break;case'snap':{let vid=document.getElementById('video');if(!vid||!vid.videoWidth){alert('请先启用摄像头。');break}let c=document.createElement('canvas'),r=Math.min(1,720/vid.videoWidth);c.width=Math.round(vid.videoWidth*r);c.height=Math.round(vid.videoHeight*r);c.getContext('2d').drawImage(vid,0,0,c.width,c.height);st.shots.unshift({src:c.toDataURL('image/jpeg',.65),name:'相机照片'});st.shots=st.shots.slice(0,12);save();alert('已保存到模拟相册。');break}case'igtab':st.ig=id;render();break;case'igphoto':st.photo=st.shots.length+(+id);go('photo');break;case'like':st.liked[id]=!st.liked[id];save();render();break;case'xhsnote':st.xhs=+id;go('xhsnote');break;case'song':st.track=+id;player.pause();player.removeAttribute('src');st.playing=false;if(audioURL){URL.revokeObjectURL(audioURL);audioURL=null}render();break;case'prevsong':st.track=(st.track+songs.length-1)%songs.length;st.playing=false;player.pause();player.removeAttribute('src');audioURL=null;render();break;case'nextsong':st.track=(st.track+1)%songs.length;st.playing=false;player.pause();player.removeAttribute('src');audioURL=null;render();break;case'addaudio':document.getElementById('audiofile').click();break;case'play':if(!audioURL){alert('先选择本地音频文件才能播放。');break}if(player.paused){try{await player.play();st.playing=true;render()}catch(e){alert('播放失败。')}}else{player.pause();st.playing=false;render()}break;case'readonly':toast('旁观模式 · 这里保留他的聊天记录');break}});
let startY=0;root.addEventListener('touchstart',e=>{startY=e.touches[0].clientY},{passive:true});root.addEventListener('touchend',e=>{if(st.page==='lock'&&startY-e.changedTouches[0].clientY>65)go('home')},{passive:true});home.addEventListener('click',()=>go('home'));
document.getElementById('wallfile').onchange=e=>{const f=e.target.files[0];if(f)compress(f,src=>{st.wall=src;save();render()});e.target.value=''};
document.getElementById('photofile').onchange=e=>{let list=Array.from(e.target.files).slice(0,10),i=0;function next(){if(i>=list.length){save();go('photos');return}let f=list[i++];compress(f,src=>{st.shots.unshift({src,name:f.name});st.shots=st.shots.slice(0,12);next()})}next();e.target.value=''};
document.getElementById('audiofile').onchange=async e=>{let f=e.target.files[0];if(!f)return;if(audioURL)URL.revokeObjectURL(audioURL);audioURL=URL.createObjectURL(f);player.src=audioURL;songs[st.track]=[f.name.replace(/\.[^.]+$/,''),'本地音频'];try{await player.play();st.playing=true}catch(e){st.playing=false}render();e.target.value=''};
player.onended=()=>{st.playing=false;render()};player.ontimeupdate=()=>{let bar=document.getElementById('progress');if(bar&&player.duration)bar.style.width=(player.currentTime/player.duration*100)+'%'};
setInterval(clock,30000);render();
})();
</script>
</body></html>
