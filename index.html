<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0d101b"><meta name="apple-mobile-web-app-capable" content="yes">
<title>私人频率 · PRIVATE FREQUENCY</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC",sans-serif;color:#fff;background:#070910;color-scheme:dark;--glass:rgba(255,255,255,.12);--stroke:rgba(255,255,255,.16);--muted:#a9adbb}
*{box-sizing:border-box}body{margin:0}button{font:inherit;color:inherit;cursor:pointer}button:focus-visible{outline:2px solid #d5b1d8;outline-offset:2px}
.stage{min-height:100dvh;display:grid;place-items:center;padding:22px;background:radial-gradient(ellipse at 50% 20%,#26273d,#070910 65%)}
.phone{position:relative;width:min(393px,100%);height:min(852px,95dvh);min-height:600px;border:7px solid #272934;border-radius:49px;overflow:hidden;background:#11151e;box-shadow:0 28px 90px #000b;isolation:isolate}
.wallpaper{position:absolute;inset:0;background:radial-gradient(ellipse 95% 58% at 92% 3%,#b19cb35c,transparent 70%),radial-gradient(ellipse 70% 70% at -15% 88%,#5167848a,transparent 72%),linear-gradient(145deg,#161724 8%,#303349 48%,#0e1829 100%);z-index:-1}
.wallpaper:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 0%,#11182745 100%)}
.status{height:55px;padding:17px 29px 0;display:flex;justify-content:space-between;align-items:flex-start;position:relative;z-index:20;font-size:15px;font-weight:650;letter-spacing:-.3px}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:119px;height:31px;border-radius:22px;background:#050608;z-index:21}
.indicators{display:flex;gap:7px;align-items:center;font-size:13px}.battery{font-size:11px;background:#f4f4f5;color:#111;border-radius:5px;padding:1px 4px}
.screen{position:absolute;inset:55px 0 0;overflow:auto;scrollbar-width:none}.screen::-webkit-scrollbar{display:none}
.homebar{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:124px;height:5px;border-radius:6px;background:#f6f7fa;z-index:22;border:0;padding:0}
.lock{height:100%;padding:47px 22px 44px;display:flex;flex-direction:column;align-items:center;text-align:center}
.lockdate{font-size:18px;font-weight:450}.locktime{font-size:83px;letter-spacing:-5px;font-weight:200;line-height:1.17}
.lockbottom{margin-top:auto;width:100%}.notification{display:flex;gap:12px;text-align:left;padding:13px;background:#ffffff29;border:1px solid #ffffff25;backdrop-filter:blur(24px);border-radius:22px;align-items:flex-start}
.notification strong{display:block;font-size:13px}.notification p{margin:5px 0 0;font-size:13px;line-height:1.5}.notification small{font-size:11px;color:#d9d9e3}
.unlockhint{margin-top:40px;font-size:12px;color:#e5e5ed}
.home{padding:29px 20px 100px;min-height:100%;display:flex;flex-direction:column}
.widget{padding:19px 20px;background:#ffffff18;backdrop-filter:blur(28px);border:1px solid #ffffff25;border-radius:25px;min-height:139px;margin-bottom:35px}
.widget .small{font-size:11px;color:#d7d7df;letter-spacing:1.4px}.widget h1{font-size:32px;letter-spacing:-1px;font-weight:400;margin:10px 0 4px}.widget p{font-size:12px;color:#d4cfda;margin:0}
.apps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:23px 8px}
.app{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:11px;padding:0;min-width:0}
.ico{width:61px;height:61px;display:grid;place-items:center;border-radius:17px;background:linear-gradient(155deg,#ffffff52,#ffffff0d);box-shadow:inset 0 1px 1px #ffffff7a,0 5px 12px #0003;border:1px solid #ffffff55;font-size:29px;overflow:hidden}
.ico svg{width:35px;height:35px}.ico.wechat{background:#07c65a;border:0}.ico.photos{background:#f8f8fa;border:0}.ico.notes{background:linear-gradient(#f3cd4d 0 24%,#fafafa 24%);color:#383b47;border:0}.ico.settings{background:#8e939e;border:0}.ico.music{background:#fbf9fa;border:0;color:#ee5572}.ico.ig{background:linear-gradient(35deg,#ffca56,#e9426d 48%,#743bce);border:0}.ico.red{background:#fff;border:0;color:#ef3349;font-weight:900;font-size:20px}.ico.safari{background:linear-gradient(145deg,#7ce4ff,#176bde);border:0}
.dock{margin-top:auto;display:flex;justify-content:space-around;padding:14px 10px;background:#ffffff24;border:1px solid #ffffff30;backdrop-filter:blur(25px);border-radius:29px}.dock .ico{width:58px;height:58px}.dock .app{font-size:0}
.appshell{height:100%;display:flex;flex-direction:column;background:#12151b}.apphead{flex-shrink:0;height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid #ffffff0b}.apphead strong{font-size:17px;font-weight:600}.back,.headbtn{background:none;border:0;font-size:26px;padding:3px 8px}.back{margin-left:-8px}.headright{min-width:34px;text-align:right}
.appbody{flex:1;min-height:0;overflow:auto;scrollbar-width:none}.appbody::-webkit-scrollbar{display:none}
.tabs{flex-shrink:0;display:flex;justify-content:space-around;padding:10px 0 19px;background:#1c1f27;border-top:1px solid #ffffff13}.tab{border:0;background:none;display:flex;flex-direction:column;gap:4px;align-items:center;color:#989ba6;font-size:10px;min-width:62px}.tab.active{color:#39cf79}.tab b{font-size:22px;font-weight:400}
.search{margin:14px 15px;background:#272b34;border-radius:12px;text-align:center;padding:9px;color:#91949e;font-size:13px}
.chatrow{display:flex;align-items:center;gap:12px;padding:15px 17px;border-bottom:1px solid #ffffff0d;background:#181b23;text-align:left;width:100%;border-left:0;border-right:0;border-top:0}
.avatar{width:49px;height:49px;flex-shrink:0;border-radius:13px;display:grid;place-items:center;background:linear-gradient(140deg,#77778d,#31384b);font-size:20px;color:#eee}
.avatar.ji{background:linear-gradient(140deg,#84726f,#3a3948)}.chatmeta{flex:1;min-width:0}.chatmeta strong{font-size:15px;font-weight:550}.chatmeta p{font-size:12px;color:#9b9da7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:6px 0 0}.when{font-size:10px;color:#838693;align-self:flex-start;margin-top:3px}
.chatview{display:flex;flex-direction:column;height:100%;background:#171b23}.chatmessages{flex:1;min-height:0;overflow-y:auto;padding:16px 12px 22px}.stamp{text-align:center;font-size:11px;color:#868b99;margin:4px 0 23px}
.msg{display:flex;align-items:flex-start;gap:9px;margin:15px 0}.msg.mine{flex-direction:row-reverse}.msg .avatar{width:37px;height:37px;border-radius:10px;font-size:15px}
.bubble{max-width:74%;border-radius:6px 13px 13px 13px;background:#303640;padding:11px 12px;font-size:13px;line-height:1.65;white-space:pre-wrap;word-break:break-word}.mine .bubble{background:#91d66f;color:#18231a;border-radius:13px 6px 13px 13px}
.replybox{padding:12px 13px 17px;background:#242831;border-top:1px solid #ffffff0f}.replylabel{font-size:11px;color:#a8acb6;margin:0 0 8px}.choice{width:100%;padding:11px 13px;text-align:left;background:#373b46;border:1px solid #ffffff12;border-radius:12px;margin:4px 0;font-size:12px;line-height:1.4}.choice:disabled{opacity:.5}
.wechatnav{height:51px;display:flex;align-items:center;justify-content:space-between;padding:0 13px;background:#1c2028;flex-shrink:0}.wechatnav strong{font-size:16px;font-weight:600}.wechatnav button{border:0;background:none;font-size:22px}
.momentcover{height:190px;background:linear-gradient(135deg,#272b43,#696477 60%,#9d8790);position:relative}.momentcover span{position:absolute;bottom:14px;right:15px;font-size:15px;font-weight:600}.moment{padding:20px 17px;display:flex;gap:12px;border-bottom:1px solid #ffffff16}.moment p{font-size:13px;line-height:1.8;margin:7px 0;color:#d5d7dd}.moment small{color:#8c92a1}.moment .avatar{width:42px;height:42px}
.gridphotos{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;padding:17px}.photo{aspect-ratio:4/5;border:0;border-radius:15px;background:linear-gradient(145deg,#393949,#a78c7e);display:flex;flex-direction:column;justify-content:end;text-align:left;padding:15px;font-size:12px;position:relative;overflow:hidden}.photo:nth-child(2){background:linear-gradient(160deg,#4d5a6e,#8b817c)}.photo:nth-child(3){background:linear-gradient(160deg,#272f3f,#695660)}.photo:before{content:"";position:absolute;width:130px;height:130px;top:-30px;right:-35px;border-radius:50%;background:#ffffff18;filter:blur(18px)}.photo small{margin-top:6px;color:#e6dfe0}.check{position:absolute;top:10px;right:10px;background:#ffffff32;border-radius:20px;padding:4px 7px;font-size:11px}
.noteslist{padding:18px}.notecard{background:#272b34;padding:20px;border-radius:15px;line-height:1.9}.notecard h2{margin:0 0 8px;font-size:20px}.notecard p{font-size:13px;color:#ddd9d9}.notecard small{color:#aaa5a3}
.primary{width:100%;background:#d9b4aa;color:#24202a;border:0;padding:13px;border-radius:12px;font-weight:650;margin-top:16px}
.muted{font-size:12px;color:#a4a7b2;line-height:1.8}.pad{padding:22px}.settingrow{padding:15px 0;border-bottom:1px solid #ffffff1a;display:flex;justify-content:space-between;font-size:13px}.settingrow span:last-child{color:#c6b4c0}
.ending{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100%;padding:30px;text-align:center;background:radial-gradient(ellipse at 50% 40%,#614b62,#1c1e2c 65%)}.ending h1{font-weight:300;font-size:42px;color:#e5c0b7}.ending p{line-height:2.1;color:#e0d7de;font-size:13px}
.toast{position:absolute;bottom:42px;left:20px;right:20px;background:#30323deb;border:1px solid #ffffff33;border-radius:17px;padding:15px;text-align:center;font-size:13px;z-index:30;backdrop-filter:blur(18px)}
@media(max-width:550px){.stage{padding:0}.phone{width:100%;height:100dvh;min-height:0;border:0;border-radius:0}}
</style>
</head>
<body><div class="stage"><main class="phone"><div class="wallpaper"></div><div class="island"></div><div class="status"><span id="clock">21:43</span><span class="indicators">▮▮▮ ◕ <span class="battery">82</span></span></div><div id="screen" class="screen"></div><button class="homebar" id="homebar" aria-label="返回主屏幕"></button></main></div>
<script>
(()=>{'use strict';
const KEY='private-frequency-ios27-v2';
const initial=()=>({screen:'lock',tab:'chats',stage:0,warmth:0,trust:0,photo:false,note:false,ending:'',messages:[{who:'him',text:'不好意思，这么晚打扰。'},{who:'him',text:'你今天是不是在返场咖啡馆落下了一本黑色笔记本？'}]});
let s;try{s={...initial(),...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{s=initial()}
const el=document.getElementById('screen'),bar=document.getElementById('homebar');
const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const options={0:[['是我的。你怎么知道是我？',0,1],['谢谢你联系我，麻烦你了。',1,1],['你是谁？',0,0]],1:[['你怎么会留意到这些？',1,1],['那我明天过去拿。',0,1],['你还挺会观察人的。',2,0]],3:[['其实我也记得你。',2,1],['原来那天你是想叫住我。',1,2],['谢谢你帮我保管。',0,0]]};
function save(){try{localStorage.setItem(KEY,JSON.stringify(s))}catch{}render()}
function go(screen){s.screen=screen;save()}
function icon(name){const icons={wechat:'<svg viewBox="0 0 48 48"><path fill="#fff" d="M20 8C9 8 3 14 3 23c0 5 3 9 7 12l-2 7 8-4c2 .5 4 .7 6 .7 1.1 0 2.1-.1 3.1-.3C22 35 20 31 20 27c0-9 7-15 17-16-4-2-10-3-17-3zm-8 14a2 2 0 1 1 0-4 2 2 0 0 1 0 4zm14 0a2 2 0 1 1 0-4 2 2 0 0 1 0 4z"/><path fill="#fff" d="M38 14c-9 0-15 5-15 13s6 13 15 13c1 0 2-.1 3-.3l5 3-1.3-5C47 35 49 31 49 27c0-8-5-13-11-13z" transform="translate(-3 -1)"/><circle cx="32" cy="25" r="1.5" fill="#07c65a"/><circle cx="42" cy="25" r="1.5" fill="#07c65a"/></svg>',photos:'<svg viewBox="0 0 48 48"><g transform="translate(24 24)"><ellipse rx="6" ry="13" cy="-9" fill="#ef5b66"/><ellipse rx="6" ry="13" cy="-9" fill="#ffba45" transform="rotate(45)"/><ellipse rx="6" ry="13" cy="-9" fill="#f4db55" transform="rotate(90)"/><ellipse rx="6" ry="13" cy="-9" fill="#63b96b" transform="rotate(135)"/><ellipse rx="6" ry="13" cy="-9" fill="#57b8d7" transform="rotate(180)"/><ellipse rx="6" ry="13" cy="-9" fill="#5576d6" transform="rotate(225)"/><ellipse rx="6" ry="13" cy="-9" fill="#ad75ca" transform="rotate(270)"/><ellipse rx="6" ry="13" cy="-9" fill="#e278a2" transform="rotate(315)"/><circle r="4.5" fill="#fff"/></g></svg>',notes:'<svg viewBox="0 0 48 48"><path d="M9 12h30M9 21h30M9 30h23M9 39h25" stroke="#9ca1ab" stroke-width="3" stroke-linecap="round"/></svg>',settings:'⚙',music:'♫',ig:'◎',red:'小红书',safari:'◉',phone:'☎',camera:'◉',calendar:'20',clock:'◷',mail:'✉'};
return icons[name]||'●'}
function app(name,label,screen){return `<button class="app" data-go="${screen}"><span class="ico ${name}">${icon(name)}</span><span>${label}</span></button>`}
function head(title,back='home',right=''){return `<header class="apphead"><button class="back" data-go="${back}" aria-label="返回">‹</button><strong>${title}</strong><span class="headright">${right}</span></header>`}
function tabs(){return `<div class="tabs">${[['chats','☏','微信'],['contacts','♙','通讯录'],['discover','◉','发现'],['me','◌','我']].map(([t,i,n])=>`<button class="tab ${s.tab===t?'active':''}" data-tab="${t}"><b>${i}</b>${n}</button>`).join('')}</div>`}
function wechat(){let content='';
if(s.tab==='chats')content=`<div class="search">⌕　搜索</div><button class="chatrow" data-go="chat"><div class="avatar ji">极</div><div class="chatmeta"><strong>张极</strong><p>${esc(s.messages[s.messages.length-1].text)}</p></div><span class="when">21:43</span></button><button class="chatrow" data-toast="其他对话将在后续章节开放"><div class="avatar">☁</div><div class="chatmeta"><strong>文件传输助手</strong><p>欢迎使用微信</p></div><span class="when">昨天</span></button>`;
if(s.tab==='contacts')content=`<div class="search">⌕　搜索</div><button class="chatrow" data-go="chat"><div class="avatar ji">极</div><div class="chatmeta"><strong>张极</strong><p>联系人 · 点击开始聊天</p></div></button>`;
if(s.tab==='discover')content=`<button class="chatrow" data-go="moments"><div class="avatar">◉</div><div class="chatmeta"><strong>朋友圈</strong><p>看看最近的动态</p></div><span>›</span></button><button class="chatrow" data-toast="该功能暂未开放"><div class="avatar">⌗</div><div class="chatmeta"><strong>扫一扫</strong></div><span>›</span></button>`;
if(s.tab==='me')content=`<div class="chatrow"><div class="avatar">我</div><div class="chatmeta"><strong>我</strong><p>微信号 · privatefrequency</p></div></div><div class="pad muted">这是女主的手机。你做出的每次回复都会改变故事的走向。</div>`;
return `<div class="appshell"><div class="wechatnav"><button data-go="home">‹</button><strong>微信${s.tab==='chats'?' (2)':''}</strong><button data-toast="功能将在后续版本开放">＋</button></div><div class="appbody">${content}</div>${tabs()}</div>`}
function chat(){let choices='';
if(s.stage===2)choices=`<p class="replylabel">先在手机相册和备忘录中找到线索</p><button class="choice" data-go="photos">打开相册 ${s.photo?'✓':'→'}</button><button class="choice" data-go="notes">打开备忘录 ${s.note?'✓':'→'}</button><button class="choice" data-act="continue" ${s.photo&&s.note?'':'disabled'}>线索已收集，继续聊天 →</button>`;
else if(s.stage===4)choices=`<p class="replylabel">张极正在等待你的回答</p>${[['yes','好，明天见。'],['maybe','可以，但我们慢慢来。'],['no','我想还是不去了。']].map(([a,t])=>`<button class="choice" data-end="${a}">${t}</button>`).join('')}`;
else if(s.stage===5)choices='<button class="choice" data-go="ending">查看你的结局 →</button>';
else choices=`<p class="replylabel">选择回复 · 影响后续剧情</p>${(options[s.stage]||[]).map(([t],i)=>`<button class="choice" data-choice="${i}">${esc(t)}</button>`).join('')}`;
return `<div class="appshell">${head('张极','wechat','⋯')}<div class="chatview"><div class="chatmessages" id="chatmessages"><div class="stamp">今天 21:43</div>${s.messages.map(m=>`<div class="msg ${m.who==='me'?'mine':''}"><div class="avatar ${m.who==='him'?'ji':''}">${m.who==='him'?'极':'我'}</div><div class="bubble">${esc(m.text)}</div></div>`).join('')}</div><div class="replybox">${choices}</div></div></div>`}
function photos(){return `<div class="appshell">${head('照片')}<div class="appbody"><div class="pad"><strong style="font-size:29px">最近项目</strong><p class="muted">10月20日 · 3张照片</p></div><div class="gridphotos"><button class="photo" data-act="photo"><span class="check">${s.photo?'✓ 已发现':'点击查看'}</span>返场咖啡馆<small>17:26 · 靠窗第二张桌子</small></button><button class="photo" data-toast="那天的雨很大，玻璃上都是水汽。">雨后的街道<small>18:04 · 路口</small></button><button class="photo" data-toast="演出票背面写着一行模糊的日期。">旧演出票<small>夹在笔记本里</small></button></div><div class="pad muted">点击第一张照片，记录剧情线索。${s.photo?' ✓ 线索已记录':''}</div></div></div>`}
function notes(){return `<div class="appshell">${head('备忘录')}<div class="appbody"><div class="noteslist"><div class="muted">置顶 · 10月20日</div><article class="notecard"><h2>关于那本笔记本</h2><small>今天 21:37</small><p>黑色封面，磨损的书角，夹着一张演出票。</p><p>明天晚上七点之后可以来拿。我会坐在老位置——靠窗第二张桌子。</p><p>其实号码不是偶然看到的。</p><p>是你离开时，我刚好追到门口，却没有来得及叫住你。</p><p>— 张极</p></article><button class="primary" data-act="note">${s.note?'✓ 已记录线索':'记录这条线索'}</button></div></div></div>`}
function moments(){return `<div class="appshell">${head('朋友圈','wechat')}<div class="appbody"><div class="momentcover"><span>PRIVATE FREQUENCY</span></div><div class="moment"><div class="avatar ji">极</div><div><strong>张极</strong><p>今天下雨的时候，咖啡馆里放了首很久没听过的歌。<br>本来想问歌名，后来忘了。</p><small>今天 19:08</small></div></div><div class="moment"><div class="avatar">我</div><div><strong>我</strong><p>有些东西丢了才会想起来，原来自己那么在意。</p><small>昨天</small></div></div></div></div>`}
function settings(){return `<div class="appshell">${head('设置')}<div class="appbody pad"><h2>私人频率</h2><p class="muted">iOS 27 灵感界面 · 普通人 AU · 第一章</p><div class="settingrow">游戏存档<span>自动保存</span></div><div class="settingrow">照片线索<span>${s.photo?'已发现':'未发现'}</span></div><div class="settingrow">备忘录线索<span>${s.note?'已发现':'未发现'}</span></div><div class="settingrow">剧情进度<span>${s.stage===5?'已通关':'第一章'}</span></div><button class="primary" data-act="reset">清除存档并重新开始</button><p class="muted">本游戏为虚构同人互动故事；iOS 与微信界面均为模拟设计，不连接真实账号。存档保存在当前浏览器。</p></div></div>`}
function placeholder(name){return `<div class="appshell">${head(name)}<div class="appbody pad"><h2>${name}</h2><p class="muted">应用已安装。更多可探索内容将在下一章节开放。</p><button class="primary" data-go="home">返回桌面</button></div></div>`}
function endpage(){const text=s.ending==='同频'?'你说了明天见。城市里有很多声音，而这一次，你们终于听见彼此。':s.ending==='慢慢来'?'你们约好再次见面，不急着为关系命名。明天七点，靠窗第二张桌子。':'你没有答应他的邀请。那条消息仍然留在屏幕上，而故事暂时停在这里。';return `<div class="ending"><small>PRIVATE FREQUENCY · CHAPTER 01</small><p>你抵达的结局</p><h1>${s.ending}</h1><p>${text}</p><button class="primary" data-go="home">回到手机桌面</button><button class="choice" style="text-align:center;margin-top:12px" data-act="reset">重新开始</button></div>`}
function render(){bar.style.display=s.screen==='lock'?'none':'block';let h='';
if(s.screen==='lock')h=`<div class="lock" data-go="home"><div class="lockdate">10月20日 星期二</div><div class="locktime">21:43</div><div class="lockbottom"><div class="notification"><span class="ico wechat" style="width:40px;height:40px;border-radius:11px;flex-shrink:0">${icon('wechat')}</span><div><small>微信 · 现在</small><strong>张极</strong><p>不好意思，这么晚打扰。</p></div></div><div class="unlockhint">轻触屏幕解锁 ↑</div></div></div>`;
if(s.screen==='home')h=`<div class="home"><div class="widget"><span class="small">PRIVATE FREQUENCY · 01</span><h1>21:43</h1><p>今晚，有一条未读消息。</p></div><div class="apps">${app('wechat','微信','wechat')}${app('photos','照片','photos')}${app('notes','备忘录','notes')}${app('music','音乐','music')}${app('ig','Instagram','ig')}${app('red','小红书','red')}${app('safari','Safari','safari')}${app('settings','设置','settings')}</div><div class="dock">${app('phone','','phone')}${app('wechat','','wechat')}${app('camera','','camera')}${app('music','','music')}</div></div>`;
if(s.screen==='wechat')h=wechat();if(s.screen==='chat')h=chat();if(s.screen==='photos')h=photos();if(s.screen==='notes')h=notes();if(s.screen==='moments')h=moments();if(s.screen==='settings')h=settings();if(s.screen==='ending')h=endpage();
if(['music','ig','red','safari','phone','camera'].includes(s.screen))h=placeholder({music:'Apple Music',ig:'Instagram',red:'小红书',safari:'Safari',phone:'电话',camera:'相机'}[s.screen]);
el.innerHTML=h;const msg=document.getElementById('chatmessages');if(msg)msg.scrollTop=msg.scrollHeight}
function say(who,text){s.messages.push({who,text})}
function choose(i){let c=(options[s.stage]||[])[i];if(!c)return;say('me',c[0]);s.warmth+=c[1];s.trust+=c[2];if(s.stage===0){say('him','那本笔记本的封面有一道折痕，里面还夹着一张演出票。');say('him','我叫张极。今天坐在你隔壁桌。');s.stage=1}else if(s.stage===1){say('him','其实有件事我没来得及告诉你。');say('him','你可以先看看相册和备忘录。等你看完，我再解释。');s.stage=2}else if(s.stage===3){say('him','我本来只想把东西还给你。');say('him','但我想问问，明天晚上七点，你愿意和我喝杯咖啡吗？');s.stage=4}save()}
function cont(){if(s.stage!==2||!s.photo||!s.note)return;say('me','我看到你留下的那段话了。');say('him','那我也不用再假装，只是碰巧捡到了你的东西。');say('him','其实那天下午，我已经注意到你很久了。');s.stage=3;s.screen='chat';save()}
function end(a){say('me',a==='yes'?'好，明天见。':a==='maybe'?'可以，但我们慢慢来。':'我想还是不去了。');s.ending=a==='no'?'未读之后':a==='yes'&&s.warmth+s.trust>=5?'同频':'慢慢来';s.stage=5;s.screen='ending';save()}
el.addEventListener('click',e=>{const b=e.target.closest('[data-go],[data-act],[data-tab],[data-choice],[data-end],[data-toast]');if(!b)return;if(b.dataset.go){go(b.dataset.go);return}if(b.dataset.tab){s.tab=b.dataset.tab;save();return}if(b.dataset.choice!==undefined){choose(Number(b.dataset.choice));return}if(b.dataset.end){end(b.dataset.end);return}if(b.dataset.toast){const d=document.createElement('div');d.className='toast';d.textContent=b.dataset.toast;document.querySelector('.phone').append(d);setTimeout(()=>d.remove(),2100);return}switch(b.dataset.act){case'photo':s.photo=true;save();break;case'note':s.note=true;save();break;case'continue':cont();break;case'reset':if(confirm('确定清除存档并重新开始吗？')){s=initial();save()}break;}});
bar.addEventListener('click',()=>go('home'));render();
})();
</script></body></html>
