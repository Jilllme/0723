function xiaohongshu(){return shell('小红书',`<div class="app-main social-app"><div style="padding:15px 17px 0;display:flex;gap:15px;align-items:center;font-weight:700;font-size:17px"><span style="color:#fff">发现</span><span style="font-size:13px;color:#888">关注</span><span style="margin-left:auto">${ic('search',21)}</span></div><div class="xhs-feed">${[['雨天适合一个人待着的咖啡馆',imgCoffee,'42'],['夜晚的城市也在发光',imgStreet,'18'],['还会想再去的街角小店',imgCafe,'63'],['把日子过成电影片段',imgCoffee,'27']].map(([name,img,likes],i)=>`<button class="xhs-card" data-do="xhs" data-index="${i}"><img src="${img}" alt="${name}" loading="lazy"><span class="xhs-card-text"><strong>${name}</strong><small>私人频率 · ♡ ${likes}</small></span></button>`).join('')}</div></div>`,{klass:'social-app'})}
function xhsDetail(){const arr=[['雨天适合一个人待着的咖啡馆',imgCoffee],['夜晚的城市也在发光',imgStreet],['还会想再去的街角小店',imgCafe],['把日子过成电影片段',imgCoffee]];const item=arr[Number(state.xhsIndex||0)];return shell('笔记',`<div class="app-main social-app"><div class="feed-photo" style="height:360px"><img src="${item[1]}" alt="${item[0]}"></div><div class="section-pad"><h2 style="font-size:18px">${item[0]}</h2><p class="quiet">走走停停。希望还能有很多这样的傍晚。</p><button class="chip-btn" data-do="like" data-kind="xhs">${state.xhsLiked?'♥ 已收藏':'♡ 收藏这篇笔记'}</button></div></div>`,{back:'xhs'})}
function settings(){return shell('设置',`<div class="app-main settings-app"><div class="settings-account"><div class="desktop-avatar">✦</div><div><strong>我的 iPhone</strong><p class="quiet" style="margin:4px 0 0">PRIVATE FREQUENCY · Obsidian</p></div></div><div class="wx-section-label" style="padding-left:18px">游戏状态</div><div class="settings-group"><div class="settings-row">章节 <span>${state.stage>=5?'第一章 · 已完成':'第一章 · 正在进行'}</span></div><div class="settings-row">聊天进度 <span>${Math.min(state.stage+1,5)}/5</span></div><div class="settings-row">照片线索 <span class="${state.photoClue?'enabled':''}">${state.photoClue?'已发现':'未发现'}</span></div><div class="settings-row">备忘录线索 <span class="${state.noteClue?'enabled':''}">${state.noteClue?'已发现':'未发现'}</span></div><div class="settings-row">自动存档 <span class="enabled">已开启</span></div></div><div class="wx-section-label" style="padding-left:18px">关于</div><div class="settings-group"><div class="settings-row">模拟系统 <span>iOS 27 启发设计</span></div><div class="settings-row">游戏版本 <span>3.0 · 独立网页版</span></div><div class="settings-row">游戏模式 <span>普通人 AU · 恋爱互动</span></div></div><p class="quiet" style="padding:0 18px">这是虚构互动作品，不是真实 iOS 或微信。所有聊天与社交动态均为剧情内容。进度仅保存在当前浏览器。</p><button class="reset-btn" data-do="reset">清空存档，重玩第一章</button></div>`,{klass:'settings-app'})}
function ending(){const end=state.ending||'慢慢来',txt=end==='同频'?'你说了「明晚见」。过了一会儿，他发来一家咖啡馆的定位，又补了一句：「这次我会早点到。」\n原来有些相遇，不是巧合结束的地方，而是故事开始的地方。':end==='慢慢来'?'你们约定了明晚七点见面。没有人急着把关系讲清楚。\n这一次，你决定不把想说的话留到下一次。':'你礼貌地谢过他的好意。笔记本会回到你的手里，聊天也暂时停在这里。\n不是所有故事，都必须在今天有答案。';return `<div class="app-shell end-screen"><div class="end-serial">PRIVATE FREQUENCY / CHAPTER 01</div><div style="font-size:11px;margin-top:25px;color:#d6bdbe">你抵达的结局</div><div class="end-title">${end}</div><p>${esc(txt).replace(/\n/g,'<br>')}</p><button class="ui-primary" data-do="go" data-screen="home">回到手机桌面</button><button class="chip-btn" data-do="reset">重新体验第一章</button></div>`}
function send(who,text){state.messages.push({who,text})}
function pick(index){state.replyOpen=false;const option=(options[state.stage]||[])[index];if(!option)return;send('me',option.text);state.warmth+=option.w;state.trust+=option.t;if(state.stage===0){send('him',index===2?'笔记本封底贴着一张二维码，店员说可以试试扫码联系。放心，我没翻里面。':'我在靠窗第二张桌子旁边捡到的。封底贴着微信二维码，我才试着加你。');send('him','我叫张极。下午坐在你隔壁桌。');state.stage=1}else if(state.stage===1){send('him',index===0?'没有翻。只确认了封面和封底。':'其实我也想问你一个问题。');send('him','你是不是觉得我有点眼熟？');state.stage=2}else if(state.stage===3){send('him',index===1?'已经洗掉了。不过我可能会记很久。':index===2?'如果你愿意的话，算。':'嗯。你离开后我才发现你的笔记本还在。');send('him','明晚七点，我把笔记本还你。');send('him','要不要顺便喝杯咖啡？这次不用等雨停。');state.stage=4}persist()}
function resume(){state.replyOpen=false;if(state.stage!==2||!(state.photoClue&&state.noteClue)){toast('先查看照片与备忘录');return}send('me','我想起来了。下午扶住我笔记本的那个人，就是你。');send('him','你终于想起来了。');send('him','我还以为自己在你眼里，只是路过的陌生人。');state.stage=3;state.screen='wxchat';persist()}
function finish(choice){state.replyOpen=false;if(state.stage!==4)return;send('me',choice==='yes'?'好，明晚七点见。':choice==='maybe'?'可以，不过我们慢慢来。':'谢谢你，但我还是自己去拿吧。');if(choice==='no'){send('him','好，没关系。我会把笔记本交给店员。');state.ending='未读之后'}else if(choice==='maybe'){send('him','好。我们慢慢来。');state.ending='慢慢来'}else{send('him','好。明晚见。');state.ending=state.warmth+state.trust>=7?'同频':'慢慢来'}state.stage=5;state.screen='ending';persist()}
function render(){outer.className='screen '+(['lock','home'].includes(state.screen)?'wallpaper':'');home.style.display=state.screen==='lock'?'none':'block';home.classList.toggle('dim',state.screen==='home');let html='';switch(state.screen){case'lock':html=lock();break;case'home':html=desktop();break;case'wechat':html=state.wxTab==='contacts'?wechatContacts():state.wxTab==='discover'?wxDiscover():state.wxTab==='me'?wxMe():wechatList();break;case'wxchat':html=wxChat();break;case'otherchat':html=otherChat();break;case'contact':html=contact();break;case'moments':html=moment();break;case'photos':html=photosList();break;case'photo':html=photoDetail();break;case'notes':html=notesList();break;case'note':html=noteDetail();break;case'music':html=music();break;case'instagram':html=instagram();break;case'xhs':html=xiaohongshu();break;case'xhsdetail':html=xhsDetail();break;case'settings':html=settings();break;case'ending':html=ending();break;default:html=desktop()}stage.innerHTML=html;stage.querySelectorAll('img').forEach(img=>img.addEventListener('error',()=>{img.style.opacity='0';img.setAttribute('aria-label','图片暂时无法加载')}));const chat=$('chatScroll');if(chat)chat.scrollTop=chat.scrollHeight;else stage.scrollTop=0}
function openApp(key){const available={wechat:'wechat',photos:'photos',notes:'notes',music:'music',instagram:'instagram',xhs:'xhs',settings:'settings'};if(available[key]){state.screen=available[key];if(key==='wechat')state.wxTab='chats';persist()}else toast('「'+({'facetime':'FaceTime','calendar':'日历','camera':'相机','mail':'邮件','clock':'时钟','map':'地图','weather':'天气','reminders':'提醒事项','appstore':'App Store','files':'文件','safari':'Safari','phone':'电话'}[key]||key)+'」为系统展示应用，暂未开放')}
function clickHandler(e){const target=e.target.closest('[data-do]');if(!target)return;const d=target.dataset;switch(d.do){case'replyopen':state.replyOpen=true;persist();break;case'replyclose':state.replyOpen=false;persist();break;case'unlock':go('home');break;case'app':openApp(d.app);break;case'go':go(d.screen);break;case'wxtab':state.wxTab=d.tab;persist();break;case'openchat':state.chatId=d.id;if(d.id==='zhang'){go('wxchat')}else go('otherchat');break;case'choice':pick(Number(d.index));break;case'continue':resume();break;case'end':finish(d.choice);break;case'photo':state.photoIndex=Number(d.index);state.photoViewed=true;go('photo');break;case'photoClue':state.photoClue=true;persist();toast('照片线索已记录');break;case'note':state.noteIndex=Number(d.index);state.noteViewed=true;go('note');break;case'noteClue':state.noteClue=true;persist();toast('备忘录线索已记录');break;case'like':if(d.kind==='moment')state.momentLiked=!state.momentLiked;if(d.kind==='ig')state.igLiked=!state.igLiked;if(d.kind==='xhs')state.xhsLiked=!state.xhsLiked;persist();break;case'play':state.musicPlaying=!state.musicPlaying;persist();if(state.musicPlaying)toast('演示版暂无可播放音频');break;case'track':state.musicTrack=(state.musicTrack+Number(d.dir)+tracks.length)%tracks.length;persist();break;case'settrack':state.musicTrack=Number(d.index);persist();break;case'fav':{const i=state.musicTrack;state.musicFav=state.musicFav.includes(i)?state.musicFav.filter(n=>n!==i):[...state.musicFav,i];persist();break}case'xhs':state.xhsIndex=Number(d.index);go('xhsdetail');break;case'toast':toast(d.text||'功能即将开放');break;case'reset':if(confirm('清空这部手机里的游戏存档，从第一章重新开始？')){state=initial();persist();toast('已重新开始')}break}}
stage.addEventListener('click',clickHandler);stage.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-do="unlock"]')){e.preventDefault();go('home')}});home.addEventListener('click',()=>go('home'));
// Local interaction only: story data stays in the current browser and is not sent to a server.
render();
})();
</script>
