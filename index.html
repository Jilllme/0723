<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c0d14">
<title>私人频率 · PRIVATE FREQUENCY</title>
<style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:#08090e;color:#f3f0f0}*{box-sizing:border-box}body{margin:0}button{font:inherit;cursor:pointer}button:focus-visible{outline:2px solid #f1bc9e;outline-offset:3px}.stage{min-height:100dvh;display:grid;place-items:center;padding:20px}.phone{position:relative;width:min(390px,100%);height:min(830px,95dvh);min-height:580px;background:radial-gradient(ellipse at 80% -5%,#3d303e 0%,transparent 42%),linear-gradient(150deg,#202635 0%,#10131e 65%,#15121b 100%);border:7px solid #2b2d34;border-radius:44px;overflow:hidden;box-shadow:0 30px 90px #0009}.island{position:absolute;z-index:6;top:8px;left:50%;transform:translateX(-50%);width:108px;height:24px;border-radius:20px;background:#06060a}.status{height:50px;display:flex;justify-content:space-between;align-items:center;padding:13px 28px;font-size:12px;position:relative;z-index:5}.page{height:calc(100% - 55px);overflow-y:auto;scrollbar-width:none}.page::-webkit-scrollbar{display:none}.homebar{position:absolute;z-index:7;bottom:9px;left:36%;width:28%;height:5px;border-radius:9px;border:0;background:#d1cbd0}.lock{height:100%;display:flex;flex-direction:column;text-align:center;padding:75px 25px 30px;cursor:pointer;background:radial-gradient(circle at 68% 35%,#704d57 0,transparent 39%),linear-gradient(#293242,#151720)}.lock .eyebrow{color:#ead3cc}.large-time{font-size:78px;letter-spacing:-4px;font-weight:200}.lock-caption{font-size:12px;color:#e6d6d3}.notice{margin-top:auto;text-align:left;background:#ffffff1c;border:1px solid #ffffff38;border-radius:17px;padding:15px 16px;line-height:1.8;backdrop-filter:blur(12px);font-size:13px}.notice strong{display:block;margin-top:6px}.notice small{color:#d3bdbe}.unlock{margin-top:48px;font-size:12px;color:#e8d9d7}.eyebrow{letter-spacing:2.4px;text-transform:uppercase;color:#c9a38f;font-size:10px}.home{padding:46px 24px}.home h1{font-weight:300;font-size:39px;letter-spacing:2px;margin:12px 0 5px}.home h1 span{color:#e2a88b}.muted{font-size:12px;line-height:1.9;color:#aca6b0}.calendar{margin:39px 0 30px;background:linear-gradient(120deg,#33303c,#293442);border:1px solid #ffffff1c;padding:20px;border-radius:18px}.calendar strong{font-weight:300;font-size:34px;display:block;margin-top:6px}.appgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.app{background:transparent;color:#e6e1e1;border:0;font-size:12px;display:flex;align-items:center;flex-direction:column;gap:10px}.appicon{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;font-size:28px;background:#3b4c4a}.app:nth-child(2) .appicon{background:#806464}.app:nth-child(3) .appicon{background:#897b59}.app:nth-child(4) .appicon{background:#535a71}.home-note{margin-top:56px;color:#c1b5b5;font-size:12px;line-height:2}.link{background:transparent;border:0;color:#e9b595;padding:0;font-size:13px}.nav{display:flex;align-items:center;gap:11px;border-bottom:1px solid #ffffff1b;min-height:61px;padding:10px 17px}.nav button{border:0;background:transparent;color:#fff;font-size:27px;line-height:1}.nav strong{font-size:16px;font-weight:500}.nav small{display:block;font-size:10px;color:#97959d;margin-top:3px}.chatpage{height:calc(100% - 61px);display:flex;flex-direction:column;min-height:0}.messages{flex:1;min-height:0;overflow:auto;padding:20px 16px 24px;scrollbar-width:none}.stamp{text-align:center;color:#95929c;font-size:11px;margin-bottom:21px}.bubble{padding:12px 14px;margin:11px 0;line-height:1.65;font-size:13px;white-space:pre-wrap;background:#303541;border-radius:16px 16px 16px 4px;max-width:83%;width:max-content}.bubble.me{margin-left:auto;background:#705950;border-radius:16px 16px 4px 16px}.choices{padding:15px 15px 22px;background:linear-gradient(#20212b,#161923);border-top:1px solid #ffffff18}.choices small{font-size:10px;color:#bdb0a6;display:block;margin-bottom:8px}.option,.primary{width:100%;border:1px solid #59535e;background:#2e303c;color:#f6f0ee;text-align:left;margin:4px 0;padding:11px 12px;border-radius:12px;font-size:12px;line-height:1.5}.primary{background:#b58a73;color:#14141b;text-align:center;font-weight:600;border-color:#b58a73}.primary:disabled{opacity:.44;cursor:not-allowed}.screen-content{padding:25px 22px 40px}.screen-content h2{font-size:24px;line-height:1.4;font-weight:400}.photograph{width:100%;height:225px;object-fit:cover;display:block;background:linear-gradient(130deg,#444450,#88736a);border-radius:14px;border:1px solid #ffffff18;margin-top:20px}.photofallback{height:170px;display:grid;place-items:center;border-radius:14px;margin-top:16px;background:linear-gradient(125deg,#4a4147,#242933);color:#d3c5c1;font-size:13px}.info{border:1px solid #ffffff1c;background:#ffffff0e;padding:16px;border-radius:13px;margin:18px 0;color:#dbd3d3;font-size:13px;line-height:1.9}.paper{padding:24px;background:#eee4d5;color:#3f3438;border-radius:10px;margin:20px 0;line-height:2.05;font-size:14px}.paper h3{font-weight:500;font-size:21px}.paper small{color:#91867c}.setting{display:flex;justify-content:space-between;gap:10px;margin:22px 0;padding-bottom:15px;border-bottom:1px solid #ffffff1a;font-size:13px}.setting span:last-child{color:#dab59d}.danger{padding:13px;background:#41323b;border:1px solid #7e5b66;color:#f0b6af;border-radius:10px}.end{padding:85px 25px;text-align:center}.end h1{color:#e0ac91;font-weight:300;font-size:43px;margin:35px 0 10px}.end p{font-size:14px;color:#cfc5c5;line-height:2.1}.end .primary{margin-top:45px}.hintbox{margin-top:17px;padding:14px;border-radius:14px;background:#ffffff12;font-size:12px;color:#e2d6d2}.hintbox button{border:0;background:none;color:#e7b292;padding:8px 14px 0 0}.footer{position:fixed;bottom:10px;left:15px;color:#89818c;font-size:10px;letter-spacing:2px}@media(max-width:560px){.stage{padding:0}.phone{width:100%;height:100dvh;min-height:0;border:0;border-radius:0}.footer{display:none}.home{padding-top:54px}}
</style>
</head>
<body><div class="stage"><main class="phone" aria-label="私人频率手机互动游戏"><div class="island"></div><div class="status"><span>21:43</span><span>● ▰ ▣</span></div><div class="page" id="page"></div><button class="homebar" id="homebar" aria-label="回到手机桌面"></button></main></div><div class="footer">PRIVATE FREQUENCY / INTERACTIVE STORY / 001</div>
<script>
(()=>{'use strict';
const key='private-frequency-v1-standalone';
const initial=()=>({screen:'lock',stage:0,warmth:0,trust:0,photo:false,note:false,reply:null,ending:null,messages:[{who:'him',text:'不好意思，这么晚打扰。'},{who:'him',text:'你今天是不是在返场咖啡馆落下了一本黑色笔记本？'}]});
let state;try{state=Object.assign(initial(),JSON.parse(localStorage.getItem(key)||'{}'))}catch{state=initial()}
const page=document.getElementById('page'),homebar=document.getElementById('homebar');
const dialogue={0:[{text:'是我的。你怎么知道是我？',w:0,t:1},{text:'谢谢你联系我，麻烦你了。',w:1,t:1},{text:'你是谁？',w:0,t:0}],1:[{text:'你怎么会留意到这些？',w:1,t:1},{text:'那我明天过去拿。',w:0,t:1},{text:'你还挺会观察人的。',w:2,t:0}],3:[{text:'其实我也记得你。',w:2,t:1},{text:'原来那天你是想叫住我。',w:1,t:2},{text:'谢谢你帮我保管。',w:0,t:0}]};
function save(){try{localStorage.setItem(key,JSON.stringify(state))}catch{}render()}
function view(screen){state.screen=screen;save()}
function say(who,text){state.messages.push({who,text})}
function select(i){const choice=dialogue[state.stage]?.[i];if(!choice)return;say('me',choice.text);state.warmth+=choice.w;state.trust+=choice.t;if(state.stage===0){say('him','那本笔记本的封面有一道折痕，里面还夹着一张演出票。');say('him','我叫张极。今天坐在你隔壁桌。');state.stage=1}else if(state.stage===1){say('him','其实有件事我没来得及告诉你。');say('him','你可以先看看相册和备忘录。等你看完，我再解释。');state.stage=2}else if(state.stage===3){say('him','我本来只想把东西还给你。');say('him','但我想问问，明天晚上七点，你愿意和我喝杯咖啡吗？');state.stage=4}save()}
function continueClues(){if(state.stage!==2||!state.photo||!state.note)return;say('me','我看到你留下的那段话了。');say('him','那我也不用再假装，只是碰巧捡到了你的东西。');say('him','其实那天下午，我已经注意到你很久了。');state.stage=3;state.screen='chat';save()}
function ending(answer){state.reply=answer;say('me',answer==='yes'?'好，明天见。':answer==='maybe'?'可以，但我们慢慢来。':'我想还是不去了。');if(answer==='no')state.ending='未读之后';else if(answer==='yes'&&state.warmth+state.trust>=5)state.ending='同频';else state.ending='慢慢来';state.stage=5;state.screen='ending';save()}
function confirmReset(){if(window.confirm('确定清除存档，从头开始吗？')){state=initial();save()}}
function nav(name,sub){return '<header class="nav"><button data-act="home" aria-label="返回桌面">‹</button><div><strong>'+name+'</strong><small>'+sub+'</small></div></header>'}
function render(){let html='';homebar.hidden=state.screen==='lock';homebar.style.display=state.screen==='lock'?'none':'block';
if(state.screen==='lock')html='<div class="lock" data-act="unlock" role="button" tabindex="0"><div class="eyebrow">TUESDAY · OCTOBER 20</div><div class="large-time">21:43</div><div class="lock-caption">有些消息，不该只停在未读。</div><div class="notice"><small>● 信息 · 现在</small><strong>张极</strong>不好意思，这么晚打扰。</div><div class="unlock">轻触屏幕解锁 ›</div></div>';
if(state.screen==='home')html='<div class="home"><div class="eyebrow">01 / PRIVATE FREQUENCY</div><h1>私人<span>频率</span></h1><div class="muted">在所有城市噪音里，听见某一个人。</div><div class="calendar"><div class="eyebrow">OCT 20 · TUESDAY</div><strong>21:43</strong></div><div class="appgrid"><button class="app" data-act="chat"><span class="appicon">✉</span>信息</button><button class="app" data-act="photos"><span class="appicon">▧</span>相册</button><button class="app" data-act="notes"><span class="appicon">▤</span>备忘录</button><button class="app" data-act="settings"><span class="appicon">⚙</span>设置</button></div><div class="home-note">收件箱里，有一段还没发生的故事。<br><button class="link" data-act="chat">继续阅读 →</button></div></div>';
if(state.screen==='chat'){html=nav('张极','私人聊天 · 未设置备注')+'<section class="chatpage"><div class="messages" id="messages"><div class="stamp">今天 21:43</div>'+state.messages.map(m=>'<div class="bubble '+(m.who==='me'?'me':'')+'">'+m.text+'</div>').join('')+(state.stage===2?'<div class="hintbox">新的线索已解锁<br>前往相册和备忘录寻找线索。<br><button data-act="photos">相册 '+(state.photo?'✓':'→')+'</button><button data-act="notes">备忘录 '+(state.note?'✓':'→')+'</button></div>':'')+'</div><div class="choices"><small>选择你的回复 · 会影响后续剧情</small>'+(state.stage===2?'<button class="primary" data-act="continue" '+(!(state.photo&&state.note)?'disabled':'')+'>'+(state.photo&&state.note?'线索已收集，继续聊天 →':'先找到两条线索')+'</button>':state.stage===4?'<button class="option" data-act="end" data-choice="yes">好，明天见。 →</button><button class="option" data-act="end" data-choice="maybe">可以，但我们慢慢来。 →</button><button class="option" data-act="end" data-choice="no">我想还是不去了。 →</button>':state.stage===5?'<button class="primary" data-act="ending">查看结局 →</button>':(dialogue[state.stage]||[]).map((c,i)=>'<button class="option" data-act="choose" data-index="'+i+'">'+c.text+' →</button>').join(''))+'</div></section>'}
if(state.screen==='photos')html=nav('相册','PHOTO LIBRARY / 02')+'<div class="screen-content"><div class="eyebrow">OCTOBER 20 · 2 PHOTOS</div><h2>有些画面会留下来。</h2><img class="photograph" src="https://images.unsplash.com/photo-1445116572660-236099ec97a0?w=900&q=85" alt="咖啡馆桌上的咖啡" data-act="photo"><div class="muted">今天 17:26 · 返场咖啡馆</div><div class="info">靠窗第二张桌子，有一本黑色笔记本。<br>'+(state.photo?'✓ 已确认照片线索':'点击上方照片，确认这条线索')+'</div><img class="photograph" src="https://images.unsplash.com/photo-1501339847302-ac426a4a7cbb?w=900&q=85" alt="咖啡馆内景"><div class="muted">今天 18:04 · 店里快打烊的时候</div><button class="primary" data-act="chat" style="margin-top:25px">返回聊天 →</button></div>';
if(state.screen==='notes')html=nav('备忘录','NOTES / PERSONAL')+'<div class="screen-content"><div class="eyebrow">1 NOTE · PINNED</div><h2>关于那本笔记本</h2><article class="paper"><small>10月20日 · 21:37</small><h3>取件说明</h3><p>黑色封面，磨损的书角，夹着一张演出票。</p><p>明天晚上七点之后可以来拿。我会坐在老位置——靠窗第二张桌子。</p><p>其实号码不是偶然看到的。</p><p>是你离开时，我刚好追到门口，却没有来得及叫住你。</p><p>— 张极</p></article><button class="primary" data-act="note">'+(state.note?'✓ 已记录备忘录线索':'记录这条线索 →')+'</button><button class="option" data-act="chat" style="text-align:center">返回聊天</button></div>';
if(state.screen==='settings')html=nav('设置','GAME SETTINGS')+'<div class="screen-content"><div class="eyebrow">STORY SETTINGS</div><h2>你的私人频率</h2><div class="setting">自动存档 <span>已开启</span></div><div class="setting">相册线索 <span>'+(state.photo?'已发现':'未发现')+'</span></div><div class="setting">备忘录线索 <span>'+(state.note?'已发现':'未发现')+'</span></div><div class="setting">游戏进度 <span>'+(state.stage===5?'已通关':'第一章')+'</span></div><p class="muted">存档仅保存在当前浏览器。清理浏览器数据可能会导致进度丢失。</p><button class="danger" data-act="reset">重新开始游戏</button></div>';
if(state.screen==='ending'){const story=state.ending==='同频'?'你说了明天见。城市里有很多声音，而这一次，你们终于听见彼此。':state.ending==='慢慢来'?'你们约好再次见面，不急着为关系命名。明天七点，靠窗第二张桌子。':'你没有答应他的邀请。那条消息仍然留在屏幕上，而故事暂时停在这里。';html='<div class="end"><div class="eyebrow">CHAPTER ONE · THE END</div><p>你抵达的结局</p><h1>'+state.ending+'</h1><p>'+story+'</p><button class="primary" data-act="home">回到手机桌面 →</button><button class="option" data-act="reset" style="text-align:center">重玩第一章</button></div>'}
page.innerHTML=html;const messages=document.getElementById('messages');if(messages)messages.scrollTop=messages.scrollHeight;else page.scrollTop=0;}
page.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;switch(b.dataset.act){case'unlock':view('home');break;case'home':view('home');break;case'chat':case'photos':case'notes':case'settings':case'ending':view(b.dataset.act);break;case'choose':select(Number(b.dataset.index));break;case'continue':continueClues();break;case'photo':state.photo=true;save();break;case'note':state.note=true;save();break;case'end':ending(b.dataset.choice);break;case'reset':confirmReset();break;}});
page.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('[data-act="unlock"]'))view('home')});homebar.addEventListener('click',()=>view('home'));render();
})();
</script>
</body>
</html>
